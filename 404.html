<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Prabodha Labs</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <style>
        .error-content {
            text-align: center;
            padding: 6rem 0;
        }
        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: 8rem;
            line-height: 1;
            margin: 0;
            background: linear-gradient(135deg, #4ade80, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(74, 222, 128, 0.2);
        }
        .error-message {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #1e293b;
            color: white;
            padding: 0.75rem 1.75rem;
            border-radius: 99px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 1px solid #334155;
        }
        .home-btn:hover {
            background-color: #334155;
            border-color: #4ade80;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(74, 222, 128, 0.15);
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-mark"></div>
                <h1>Prabodha Labs</h1>
            </div>
            <p class="tagline">Crafting intelligent, relaxing, and beautiful gaming experiences.</p>
        </header>

        <main>
            <section class="error-content">
                <h1 class="error-code">404</h1>
                <p class="error-message">Oops! Looks like this page drifted off into space.</p>
                <a href="/" class="home-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Return to Base
                </a>
            </section>
        </main>

        <footer>
            <div class="footer-links">
                <a href="https://neon-sync.prabodhalabs.com/privacy.html">Privacy Policy</a>
                <span class="separator">|</span>
                <a href="https://neon-sync.prabodhalabs.com/terms.html">Terms of Service</a>
                <span class="separator">|</span>
                <a href="https://neon-sync.prabodhalabs.com/support.html">Contact Support</a>
            </div>
            <p>&copy; 2026 Prabodha Labs. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
