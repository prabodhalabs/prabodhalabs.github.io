<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | Prabodha Labs Blog</title>
    <meta name="description" content="{{DESCRIPTION}}">
    
    <!-- Open Graph for social sharing -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="article">
    <meta property="article:published_time" content="{{DATE_ISO}}">

    <link rel="stylesheet" href="/style.css?v=2">
    <link rel="stylesheet" href="/blog.css?v=2">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <div class="logo-mark"></div> Prabodha Labs
            </a>
        </div>
    </nav>
    
    <article class="post-container">
        <a href="/blog/" class="back-link">← Back to Blog</a>
        
        <header class="post-header">
            <h1>{{TITLE}}</h1>
            <div class="post-meta-full">
                <time datetime="{{DATE_ISO}}">{{DATE}}</time>
                <span>&bull;</span>
                <span>{{READING_TIME}} min read</span>
                <span>&bull;</span>
                <div class="blog-tags">
                    {{TAGS}}
                </div>
            </div>
        </header>

        <div class="post-content">
            {{CONTENT}}
        </div>

        <div class="post-footer-cta">
            <h3>Ready to test your mind?</h3>
            <p>Try Neon Sync, the minimalistic puzzle game designed to sharpen your thinking.</p>
            <a href="https://play.google.com/store/apps/details?id=com.neonsync.game" class="badge-cta">
                <img style="height: 50px;" src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play">
            </a>
        </div>
    </article>

    <footer class="footer">
        <div class="container">
            <div class="footer-links" style="display: flex; gap: 15px; justify-content: center; margin-bottom: 1rem;">
                <a href="https://neon-sync.prabodhalabs.com/privacy.html">Privacy</a>
                <a href="https://neon-sync.prabodhalabs.com/terms.html">Terms</a>
                <a href="https://neon-sync.prabodhalabs.com/support.html">Support</a>
                <a href="https://neon-sync.prabodhalabs.com/data-deletion.html">Data Deletion</a>
            </div>
            <p class="copyright">&copy; <script>document.write(new Date().getFullYear())</script> Prabodha Labs. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
